name: Rust CI - Update Artifacts

on:
  schedule:
    - cron: '0 5 * * *' # Daily at 05:00 UTC
  workflow_dispatch: # Allow manual triggers

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  update-artifacts:
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        network: [polkadot, kusama, paseo, westend]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1

      - name: Install subxt
        run: cargo install subxt-cli --locked --features chain-spec-pruning

      - name: Run update-metadata script
        env:
          METADATA_VERSIONS_FILE: ${{ runner.temp }}/metadata_versions-${{ matrix.network }}.md
        run: bash scripts/update-metadata.sh ${{ matrix.network }}

      - name: Run update-chain-specs script
        run: bash scripts/update-chain-specs.sh ${{ matrix.network }}

      - name: Check for changes
        id: changes
        env:
          NETWORK_PATHS: >-
            packages/chains/relay-chain-${{ matrix.network }}
            packages/chains/asset-hub-${{ matrix.network }}
            packages/chains/people-${{ matrix.network }}
            packages/support/chain-specs/${{ matrix.network }}.json
        run: |
          if git diff --quiet -- $NETWORK_PATHS && git diff --staged --quiet -- $NETWORK_PATHS; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
          echo "network_paths=$(echo $NETWORK_PATHS | tr ' ' ',')" >> $GITHUB_OUTPUT

      - name: Build PR body
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          {
            echo "Automated ${{ matrix.network }} chain specs and metadata update."
            echo
            echo '```'
            cat "${{ runner.temp }}/metadata_versions-${{ matrix.network }}.md"
            echo '```'
          } > "${{ runner.temp }}/pr_body-${{ matrix.network }}.md"

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-artifacts-${{ matrix.network }}
          add-paths: ${{ steps.changes.outputs.network_paths }}
          commit-message: 'chore: update ${{ matrix.network }} artifacts'
          title: 'chore: update ${{ matrix.network }} artifacts'
          body-path: ${{ runner.temp }}/pr_body-${{ matrix.network }}.md
          labels: automated, chain-specs, metadata, ${{ matrix.network }}
          delete-branch: true
